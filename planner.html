<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Study Planner — MindMATE AI+</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#F9A8C0;--pink-d:#E07898;--pink-l:#FFD6E7;--pink-ll:#FFF0F5;
  --blue:#A8D4F9;--blue-d:#5FA8E0;--blue-l:#D6EEFF;--blue-ll:#EFF7FF;
  --green:#A8E6C0;--green-d:#4DB87A;--green-l:#D6F5E3;--green-ll:#EDFAF3;
  --bg:#FDFAFC;--white:#fff;--dark:#2D2A3A;--gray:#7A7A8C;--border:#EDE6EF;
  --shadow:0 4px 24px rgba(168,212,249,.13);
}

body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh}

nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 2.5rem;height:66px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.nav-logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;color:var(--pink-d);text-decoration:none}
.nav-logo .ai{color:var(--blue-d)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{text-decoration:none;color:var(--gray);font-weight:600;font-size:.9rem;padding-bottom:3px}
.nav-links a:hover{color:var(--pink-d)}
.nav-links a.active{color:var(--pink-d);font-weight:800;border-bottom:2px solid var(--pink)}
.nav-avatar{background:linear-gradient(135deg,var(--pink),var(--blue));color:#fff;border:none;padding:10px 22px;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer}

main{max-width:950px;margin:0 auto;padding:2.5rem 1.5rem}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.page-top h1{font-size:1.6rem;font-weight:900}
.page-top p{font-size:.88rem;color:var(--gray);margin-top:.25rem}

.btn-ai{background:linear-gradient(135deg,var(--pink),var(--blue-d));color:#fff;border:none;padding:11px 22px;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.875rem;cursor:pointer}

.week-nav{display:flex;gap:.5rem;margin-bottom:1.75rem;overflow-x:auto;padding-bottom:4px}
.day-pill{min-width:70px;padding:.7rem .5rem;border-radius:14px;text-align:center;cursor:pointer;border:1.5px solid var(--border);background:var(--white)}
.day-pill.active{background:linear-gradient(135deg,var(--pink-l),var(--blue-l));border-color:var(--blue)}
.day-name{font-size:.72rem;font-weight:700;color:var(--gray)}
.day-num{font-size:1.2rem;font-weight:900;margin-top:2px;color:var(--blue-d)}

.planner-grid{display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start}

.tasks-card{background:var(--white);border-radius:20px;border:1.5px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.tasks-header{display:grid;grid-template-columns:1.6fr 1fr 1fr .8fr;padding:.85rem 1.25rem;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--pink-ll),var(--blue-ll))}
.tasks-header span{font-size:.78rem;font-weight:800;color:var(--gray);text-transform:uppercase}

.task-row{display:grid;grid-template-columns:1.6fr 1fr 1fr .8fr;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);align-items:center}
.task-row:hover{background:var(--pink-ll)}
.task-time{font-size:.82rem;color:var(--gray);font-weight:600}
.task-name{font-size:.9rem;font-weight:800;display:flex;align-items:center;gap:.6rem}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:inline-block}
.task-check.done{background:var(--green-d);border-color:var(--green-d)}
.task-subj{font-size:.82rem;color:var(--gray);font-weight:600}

.priority{font-size:.75rem;font-weight:800;padding:4px 12px;border-radius:50px;display:inline-block}
.p-high{background:var(--pink-l);color:var(--pink-d)}
.p-med{background:var(--blue-l);color:var(--blue-d)}
.p-low{background:var(--green-l);color:var(--green-d)}

.add-task-btn{margin:1.1rem 1.25rem;background:transparent;border:2px dashed var(--blue);color:var(--blue-d);font-family:'Nunito',sans-serif;font-weight:800;font-size:.875rem;padding:9px 18px;border-radius:10px;cursor:pointer}
.add-form{display:none;padding:1rem 1.25rem;border-top:1px solid var(--border);gap:.6rem;flex-wrap:wrap;align-items:center}
.add-form.show{display:flex}
.add-form input,.add-form select{border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-family:'Nunito',sans-serif;font-size:.875rem;font-weight:600;color:var(--dark);background:var(--bg);outline:none}
.save-btn{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;border:none;border-radius:8px;padding:9px 18px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.875rem;cursor:pointer}

.ai-insight{background:linear-gradient(135deg,var(--pink-ll),var(--blue-ll),var(--green-ll));border-radius:16px;padding:1.25rem;border:1.5px solid var(--border)}
.ai-insight-label{font-weight:900;font-size:.875rem;color:var(--pink-d);margin-bottom:.6rem}
.ai-insight p{font-size:.85rem;color:var(--dark);line-height:1.6}

@media(max-width:700px){
  .planner-grid{grid-template-columns:1fr}
  .tasks-header,.task-row{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<nav>
  <a href="index.html" class="nav-logo">🧠 MindMATE <span class="ai">AI+</span></a>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="mood.html">Mood Check</a></li>
    <li><a href="planner.html" class="active">Study Planner</a></li>
    <li><a href="habits.html">Habits</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>

  <button class="nav-avatar" onclick="doLogout()" title="Logout">Logout</button>
</nav>

<main>
  <div class="page-top">
    <div>
      <h1>AI Study Planner ✨</h1>
      <p>Let AI build the perfect study plan based on your goals and time.</p>
    </div>

    <button class="btn-ai" onclick="generatePlan()">✏️ Generate Plan with AI</button>
  </div>

  <div class="week-nav" id="weekNav"></div>

  <div class="planner-grid">
    <div class="tasks-card">
      <div class="tasks-header">
        <span>Time</span>
        <span>Task</span>
        <span>Subject</span>
        <span>Priority</span>
      </div>

      <div id="taskList"></div>

      <button class="add-task-btn" onclick="toggleForm()">+ Add Task</button>

      <div class="add-form" id="addForm">
        <input type="text" id="fTime" placeholder="9:00 AM – 10:00 AM" style="width:155px"/>
        <input type="text" id="fTask" placeholder="Task name..." style="flex:1;min-width:120px"/>
        <input type="text" id="fSubj" placeholder="Subject" style="width:100px"/>

        <select id="fPrio">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>

        <button class="save-btn" onclick="addTask()">Add</button>
      </div>
    </div>

    <div class="ai-insight">
      <div class="ai-insight-label">✨ AI Insight</div>
      <p id="insightText">You study best in the evening. Consider scheduling difficult tasks after 4 PM.</p>
    </div>
  </div>
</main>

<script>
const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const dates = [13,14,15,16,17,18,19];

window.activeDay = 1;

const weekNav = document.getElementById("weekNav");

days.forEach((day, index) => {
  const el = document.createElement("div");
  el.className = "day-pill" + (index === window.activeDay ? " active" : "");

  el.innerHTML = `
    <div class="day-name">${day}</div>
    <div class="day-num">${dates[index]}</div>
  `;

  el.onclick = async () => {
    document.querySelectorAll(".day-pill").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    window.activeDay = index;

    if (window.loadTasksForDay) {
      await window.loadTasksForDay(index);
    }
  };

  weekNav.appendChild(el);
});

window.tasks = [
  {time:"9:00 AM – 10:30 AM", name:"Math Homework", subj:"Math", prio:"High", done:false},
  {time:"11:00 AM – 12:00 PM", name:"Biology Reading", subj:"Biology", prio:"Medium", done:false},
  {time:"2:00 PM – 3:30 PM", name:"History Notes", subj:"History", prio:"Low", done:false},
  {time:"4:00 PM – 5:00 PM", name:"Practice Questions", subj:"Math", prio:"Medium", done:false}
];

function priorityClass(p) {
  if (p === "High") return "p-high";
  if (p === "Low") return "p-low";
  return "p-med";
}

window.renderTasks = function () {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  window.tasks.forEach((task, index) => {
    const row = document.createElement("div");
    row.className = "task-row";

    row.innerHTML = `
      <span class="task-time">${task.time}</span>
      <span class="task-name">
        <span class="task-check ${task.done ? "done" : ""}" onclick="togTask(${index})"></span>
        ${task.name}
      </span>
      <span class="task-subj">${task.subj}</span>
      <span>
        <span class="priority ${priorityClass(task.prio)}">${task.prio}</span>
      </span>
    `;

    list.appendChild(row);
  });
};

window.togTask = async function (index) {
  window.tasks[index].done = !window.tasks[index].done;
  window.renderTasks();

  if (window.saveTasksForDay) {
    await window.saveTasksForDay();
  }
};

window.toggleForm = function () {
  const form = document.getElementById("addForm");
  form.classList.toggle("show");

  if (form.classList.contains("show")) {
    document.getElementById("fTask").focus();
  }
};

window.addTask = async function () {
  const time = document.getElementById("fTime").value.trim() || "—";
  const name = document.getElementById("fTask").value.trim();
  const subj = document.getElementById("fSubj").value.trim() || "—";
  const prio = document.getElementById("fPrio").value;

  if (!name) return;

  window.tasks.push({
    time,
    name,
    subj,
    prio,
    done:false
  });

  document.getElementById("fTime").value = "";
  document.getElementById("fTask").value = "";
  document.getElementById("fSubj").value = "";
  document.getElementById("addForm").classList.remove("show");

  window.renderTasks();

  if (window.saveTasksForDay) {
    await window.saveTasksForDay();
  }
};

window.generatePlan = async function () {
  window.tasks = [
    {time:"9:00 AM – 10:00 AM", name:"Review Lecture Notes", subj:"Math", prio:"High", done:false},
    {time:"10:30 AM – 11:30 AM", name:"Chapter Summary", subj:"Biology", prio:"Medium", done:false},
    {time:"1:00 PM – 2:00 PM", name:"Practice Problems", subj:"Physics", prio:"High", done:false},
    {time:"3:00 PM – 4:00 PM", name:"Essay Draft", subj:"History", prio:"Low", done:false},
    {time:"5:00 PM – 6:00 PM", name:"Flashcard Review", subj:"Math", prio:"Medium", done:false}
  ];

  window.renderTasks();

  document.getElementById("insightText").textContent =
    "AI plan generated! Your peak focus time is 9–11 AM and 5–7 PM. Hard tasks are scheduled accordingly. 🎯";

  if (window.saveTasksForDay) {
    await window.saveTasksForDay();
  }
};

window.renderTasks();
</script>

<script type="module">
import {
  onAuth,
  getTasks,
  saveTasks,
  logout
} from "./firebase.js";

function getDateKey(index) {
  return "2026-05-" + String(dates[index]).padStart(2, "0");
}

onAuth(async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const logoutBtn = document.querySelector(".nav-avatar");

  if (logoutBtn) {
    logoutBtn.title = user.email || "Logout";
  }

  window.loadTasksForDay = async function (index) {
    const key = getDateKey(index);

    try {
      const savedTasks = await getTasks(key);

      if (savedTasks && Array.isArray(savedTasks)) {
        window.tasks = savedTasks;
      } else {
        window.tasks = [];
      }

      window.renderTasks();
    } catch (error) {
      console.log("Load tasks error:", error);
    }
  };

  window.saveTasksForDay = async function () {
    const key = getDateKey(window.activeDay);

    try {
      await saveTasks(key, window.tasks);
    } catch (error) {
      console.log("Save tasks error:", error);
    }
  };

  await window.loadTasksForDay(window.activeDay);
});

window.doLogout = async function () {
  await logout();
};
</script>

</body>
</html>
